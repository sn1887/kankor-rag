[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rag-core"
version = "0.1.0"
description = "Reusable modular RAG engine for the Kankor RAG Space and future projects."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.4",
  "orjson>=3.10.15",
  "pydantic>=2.10.6",
  "typing-extensions>=4.12.2"
]

[project.optional-dependencies]
serve = [
  "datasets>=3.2.0",
  "faiss-cpu>=1.10.0",
  "FlagEmbedding>=1.3.4",
  "google-genai>=1.0.0",
  "huggingface_hub>=0.29.0",
  "onnxruntime>=1.20.0",
  "accelerate>=1.2.1",
  "openai>=1.0.0",
  "pypdf>=4.2.0",
  "sentencepiece>=0.2.0",
  "sentence-transformers>=3.4.1",
  # Torch 2.6+ is required by the current model-loading stack due upstream security restrictions.
  "torch>=2.6.0,<2.8",
  "transformers>=4.49.0,<5"
]

dev = ["pytest>=8.3.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
