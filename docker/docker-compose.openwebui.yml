services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      RAG_UI_INTERFACE: openwebui
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      RAG_OPENAI_COMPAT_API_KEY: ${RAG_OPENAI_COMPAT_API_KEY:-changeme}
      RAG_INDEX_PATH: ${RAG_INDEX_PATH:-/app/data/sample_index/index.faiss}
      RAG_DOCSTORE_PATH: ${RAG_DOCSTORE_PATH:-/app/data/sample_index/metadata.jsonl}
      RAG_VECTOR_STORE_BACKEND: ${RAG_VECTOR_STORE_BACKEND:-faiss}
      RAG_LLM_BACKEND: ${RAG_LLM_BACKEND:-openai}
      RAG_EMBEDDING_BACKEND: ${RAG_EMBEDDING_BACKEND:-hash}
      RAG_OPENAI_MODEL_ID: ${RAG_OPENAI_MODEL_ID:-gpt-4o-mini}
      RAG_OPENAI_EMBEDDING_MODEL_ID: ${RAG_OPENAI_EMBEDDING_MODEL_ID:-text-embedding-3-small}
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_GEMINI_MODEL_ID: ${RAG_GEMINI_MODEL_ID:-gemini-2.0-flash}
      RAG_GEMINI_EMBEDDING_MODEL_ID: ${RAG_GEMINI_EMBEDDING_MODEL_ID:-gemini-embedding-001}
      RAG_GEMINI_API_KEY: ${RAG_GEMINI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAG_GEMINI_BASE_URL: ${RAG_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      RAG_GEMINI_TIMEOUT_SECONDS: ${RAG_GEMINI_TIMEOUT_SECONDS:-120.0}
      RAG_GEMINI_EMBEDDING_DIMENSIONS: ${RAG_GEMINI_EMBEDDING_DIMENSIONS:-}
      RAG_DEEPSEEK_MODEL_ID: ${RAG_DEEPSEEK_MODEL_ID:-deepseek-chat}
      RAG_DEEPSEEK_EMBEDDING_MODEL_ID: ${RAG_DEEPSEEK_EMBEDDING_MODEL_ID:-deepseek-embedding}
      RAG_DEEPSEEK_API_KEY: ${RAG_DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RAG_DEEPSEEK_BASE_URL: ${RAG_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      RAG_DEEPSEEK_TIMEOUT_SECONDS: ${RAG_DEEPSEEK_TIMEOUT_SECONDS:-120.0}
      RAG_DEEPSEEK_EMBEDDING_DIMENSIONS: ${RAG_DEEPSEEK_EMBEDDING_DIMENSIONS:-}
      RAG_MAX_NEW_TOKENS_HARD_LIMIT: ${RAG_MAX_NEW_TOKENS_HARD_LIMIT:-1024}
      RAG_DEMO_MODE: ${RAG_DEMO_MODE:-true}
    volumes:
      - ../data:/app/data:ro
      - ../apps/api:/app/apps/api:ro
      - ../packages:/app/packages:ro
    ports:
      - '8000:8000'

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - api
    environment:
      OPENAI_API_BASE_URL: http://api:8000/v1
      OPENAI_API_BASE_URLS: http://api:8000/v1
      OPENAI_API_KEY: ${RAG_OPENAI_COMPAT_API_KEY:-changeme}
      OPENAI_API_KEYS: ${RAG_OPENAI_COMPAT_API_KEY:-changeme}
    ports:
      - '3000:8080'
    volumes:
      - openwebui-data:/app/backend/data

volumes:
  openwebui-data:
