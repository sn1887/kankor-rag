services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RAG_UI_INTERFACE: openwebui
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      RAG_OPENAI_COMPAT_API_KEY: ${RAG_OPENAI_COMPAT_API_KEY:-changeme}
      RAG_OPENAI_COMPAT_MODEL_ALIAS: ${RAG_OPENAI_COMPAT_MODEL_ALIAS:-}
      RAG_INDEX_PATH: ${RAG_INDEX_PATH:-/app/data/sample_index/index.faiss}
      RAG_DOCSTORE_PATH: ${RAG_DOCSTORE_PATH:-/app/data/sample_index/metadata.jsonl}
      RAG_CHAPTER_INDEX_PATH: ${RAG_CHAPTER_INDEX_PATH:-}
      RAG_TOPIC_INDEX_PATH: ${RAG_TOPIC_INDEX_PATH:-}
      RAG_TOC_MANIFEST_PATH: ${RAG_TOC_MANIFEST_PATH:-}
      RAG_VECTOR_STORE_BACKEND: ${RAG_VECTOR_STORE_BACKEND:-faiss}
      RAG_LLM_BACKEND: ${RAG_LLM_BACKEND:-openai}
      RAG_CONTEXT_MODE: ${RAG_CONTEXT_MODE:-text}
      RAG_DEFAULT_LANGUAGE: ${RAG_DEFAULT_LANGUAGE:-fa}
      RAG_PDF_WINDOW_MAX_ATTACHMENTS: ${RAG_PDF_WINDOW_MAX_ATTACHMENTS:-3}
      RAG_PDF_WINDOW_MAX_PAGES_PER_ATTACHMENT: ${RAG_PDF_WINDOW_MAX_PAGES_PER_ATTACHMENT:-4}
      RAG_EMBEDDING_BACKEND: ${RAG_EMBEDDING_BACKEND:-hash}
      RAG_BGE_M3_MODEL_ID: ${RAG_BGE_M3_MODEL_ID:-BAAI/bge-m3}
      RAG_BGE_M3_BATCH_SIZE: ${RAG_BGE_M3_BATCH_SIZE:-32}
      RAG_BGE_M3_USE_FP16: ${RAG_BGE_M3_USE_FP16:-}
      RAG_BGE_M3_DEVICE: ${RAG_BGE_M3_DEVICE:-}
      RAG_BGE_M3_MAX_LENGTH: ${RAG_BGE_M3_MAX_LENGTH:-8192}
      RAG_OPENAI_MODEL_ID: ${RAG_OPENAI_MODEL_ID:-gpt-4o-mini}
      RAG_OPENAI_EMBEDDING_MODEL_ID: ${RAG_OPENAI_EMBEDDING_MODEL_ID:-text-embedding-3-small}
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_GEMINI_MODEL_ID: ${RAG_GEMINI_MODEL_ID:-gemini-2.0-flash}
      RAG_GEMINI_FALLBACK_MODEL_ID: ${RAG_GEMINI_FALLBACK_MODEL_ID:-}
      RAG_GEMINI_EMBEDDING_MODEL_ID: ${RAG_GEMINI_EMBEDDING_MODEL_ID:-gemini-embedding-001}
      RAG_GEMINI_API_KEY: ${RAG_GEMINI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAG_GEMINI_BASE_URL: ${RAG_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      RAG_GEMINI_TIMEOUT_SECONDS: ${RAG_GEMINI_TIMEOUT_SECONDS:-120.0}
      RAG_GEMINI_NATIVE_RETRY_ATTEMPTS: ${RAG_GEMINI_NATIVE_RETRY_ATTEMPTS:-2}
      RAG_GEMINI_NATIVE_RETRY_DELAY_SECONDS: ${RAG_GEMINI_NATIVE_RETRY_DELAY_SECONDS:-1.0}
      RAG_GEMINI_EMBEDDING_DIMENSIONS: ${RAG_GEMINI_EMBEDDING_DIMENSIONS:-}
      RAG_DEEPSEEK_MODEL_ID: ${RAG_DEEPSEEK_MODEL_ID:-deepseek-chat}
      RAG_DEEPSEEK_EMBEDDING_MODEL_ID: ${RAG_DEEPSEEK_EMBEDDING_MODEL_ID:-deepseek-embedding}
      RAG_DEEPSEEK_API_KEY: ${RAG_DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RAG_DEEPSEEK_BASE_URL: ${RAG_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      RAG_DEEPSEEK_TIMEOUT_SECONDS: ${RAG_DEEPSEEK_TIMEOUT_SECONDS:-120.0}
      RAG_DEEPSEEK_EMBEDDING_DIMENSIONS: ${RAG_DEEPSEEK_EMBEDDING_DIMENSIONS:-}
      RAG_MAX_NEW_TOKENS: ${RAG_MAX_NEW_TOKENS:-4096}
      RAG_MAX_NEW_TOKENS_HARD_LIMIT: ${RAG_MAX_NEW_TOKENS_HARD_LIMIT:-6000}
      RAG_DEMO_MODE: ${RAG_DEMO_MODE:-true}
      RAG_PDF_WINDOW_ADAPTIVE_ENABLED: ${RAG_PDF_WINDOW_ADAPTIVE_ENABLED:-false}
      RAG_PDF_WINDOW_ADAPTIVE_MIN_ATTACHMENTS: ${RAG_PDF_WINDOW_ADAPTIVE_MIN_ATTACHMENTS:-1}
      RAG_PDF_WINDOW_ADAPTIVE_TOP_SCORE_LOW: ${RAG_PDF_WINDOW_ADAPTIVE_TOP_SCORE_LOW:-0.42}
      RAG_PDF_WINDOW_ADAPTIVE_TOP_SCORE_VERY_LOW: ${RAG_PDF_WINDOW_ADAPTIVE_TOP_SCORE_VERY_LOW:-0.30}
      RAG_PDF_WINDOW_ADAPTIVE_SCORE_GAP_LOW: ${RAG_PDF_WINDOW_ADAPTIVE_SCORE_GAP_LOW:-0.003}
      RAG_PDF_WINDOW_ADAPTIVE_COMPLEXITY_LENGTH_TOKENS: ${RAG_PDF_WINDOW_ADAPTIVE_COMPLEXITY_LENGTH_TOKENS:-25}
      RAG_USE_V6_RETRIEVAL: "false"
      RAG_V6_PAGE_LOCALIZATION_MIN_CONFIDENCE: ${RAG_V6_PAGE_LOCALIZATION_MIN_CONFIDENCE:-0.4}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_BACKEND: ${RAG_RERANKER_BACKEND:-onnx_cross_encoder}
      RAG_RERANKER_MODEL_ID: ${RAG_RERANKER_MODEL_ID:-onnx-community/gte-multilingual-reranker-base}
      RAG_RERANKER_MODEL_REVISION: ${RAG_RERANKER_MODEL_REVISION:-5807a06097ed1e68331fec2201751ccaf356d96b}
      RAG_RERANKER_CANDIDATE_POOL_SIZE: ${RAG_RERANKER_CANDIDATE_POOL_SIZE:-8}
      RAG_RERANKER_MAX_LENGTH: ${RAG_RERANKER_MAX_LENGTH:-256}
      RAG_RERANKER_BATCH_SIZE: ${RAG_RERANKER_BATCH_SIZE:-8}
      RAG_RERANKER_TIMEOUT_MS: ${RAG_RERANKER_TIMEOUT_MS:-1500}
      RAG_TOC_ROUTING_MODE: ${RAG_TOC_ROUTING_MODE:-safe_topic_aware}
      RAG_TOC_TRACE_SAMPLE_RATE: ${RAG_TOC_TRACE_SAMPLE_RATE:-1.0}
      RAG_TIMING_DEBUG: ${RAG_TIMING_DEBUG:-false}

    volumes:
      - ../data:/app/data:ro
      - ../apps/api:/app/apps/api:ro
      - ../packages:/app/packages:ro
      - huggingface-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - '127.0.0.1:8000:8000'

  api-whatsapp:
    profiles: ["whatsapp-local"]
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RAG_UI_INTERFACE: openwebui
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      RAG_OPENAI_COMPAT_API_KEY: ${RAG_OPENAI_COMPAT_API_KEY:-changeme}
      RAG_OPENAI_COMPAT_MODEL_ALIAS: ${RAG_OPENAI_COMPAT_MODEL_ALIAS:-}
      RAG_INDEX_PATH: ${RAG_INDEX_PATH:-/app/data/sample_index/index.faiss}
      RAG_DOCSTORE_PATH: ${RAG_DOCSTORE_PATH:-/app/data/sample_index/metadata.jsonl}
      RAG_CHAPTER_INDEX_PATH: ${RAG_CHAPTER_INDEX_PATH:-}
      RAG_TOPIC_INDEX_PATH: ${RAG_TOPIC_INDEX_PATH:-}
      RAG_TOC_MANIFEST_PATH: ${RAG_TOC_MANIFEST_PATH:-}
      RAG_VECTOR_STORE_BACKEND: ${RAG_VECTOR_STORE_BACKEND:-faiss}
      RAG_LLM_BACKEND: ${RAG_LLM_BACKEND:-openai}
      RAG_CONTEXT_MODE: ${RAG_CONTEXT_MODE:-text}
      RAG_DEFAULT_LANGUAGE: ${RAG_DEFAULT_LANGUAGE:-fa}
      RAG_PDF_WINDOW_MAX_ATTACHMENTS: ${RAG_PDF_WINDOW_MAX_ATTACHMENTS:-3}
      RAG_PDF_WINDOW_MAX_PAGES_PER_ATTACHMENT: ${RAG_PDF_WINDOW_MAX_PAGES_PER_ATTACHMENT:-4}
      RAG_EMBEDDING_BACKEND: ${RAG_EMBEDDING_BACKEND:-hash}
      RAG_BGE_M3_MODEL_ID: ${RAG_BGE_M3_MODEL_ID:-BAAI/bge-m3}
      RAG_BGE_M3_BATCH_SIZE: ${RAG_BGE_M3_BATCH_SIZE:-32}
      RAG_BGE_M3_USE_FP16: ${RAG_BGE_M3_USE_FP16:-}
      RAG_BGE_M3_DEVICE: ${RAG_BGE_M3_DEVICE:-}
      RAG_BGE_M3_MAX_LENGTH: ${RAG_BGE_M3_MAX_LENGTH:-8192}
      RAG_OPENAI_MODEL_ID: ${RAG_OPENAI_MODEL_ID:-gpt-4o-mini}
      RAG_OPENAI_EMBEDDING_MODEL_ID: ${RAG_OPENAI_EMBEDDING_MODEL_ID:-text-embedding-3-small}
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_GEMINI_MODEL_ID: ${RAG_GEMINI_MODEL_ID:-gemini-2.0-flash}
      RAG_GEMINI_FALLBACK_MODEL_ID: ${RAG_GEMINI_FALLBACK_MODEL_ID:-}
      RAG_GEMINI_EMBEDDING_MODEL_ID: ${RAG_GEMINI_EMBEDDING_MODEL_ID:-gemini-embedding-001}
      RAG_GEMINI_API_KEY: ${RAG_GEMINI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAG_GEMINI_BASE_URL: ${RAG_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      RAG_GEMINI_TIMEOUT_SECONDS: ${RAG_GEMINI_TIMEOUT_SECONDS:-120.0}
      RAG_GEMINI_NATIVE_RETRY_ATTEMPTS: ${RAG_GEMINI_NATIVE_RETRY_ATTEMPTS:-2}
      RAG_GEMINI_NATIVE_RETRY_DELAY_SECONDS: ${RAG_GEMINI_NATIVE_RETRY_DELAY_SECONDS:-1.0}
      RAG_GEMINI_EMBEDDING_DIMENSIONS: ${RAG_GEMINI_EMBEDDING_DIMENSIONS:-}
      RAG_DEEPSEEK_MODEL_ID: ${RAG_DEEPSEEK_MODEL_ID:-deepseek-chat}
      RAG_DEEPSEEK_EMBEDDING_MODEL_ID: ${RAG_DEEPSEEK_EMBEDDING_MODEL_ID:-deepseek-embedding}
      RAG_DEEPSEEK_API_KEY: ${RAG_DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RAG_DEEPSEEK_BASE_URL: ${RAG_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      RAG_DEEPSEEK_TIMEOUT_SECONDS: ${RAG_DEEPSEEK_TIMEOUT_SECONDS:-120.0}
      RAG_DEEPSEEK_EMBEDDING_DIMENSIONS: ${RAG_DEEPSEEK_EMBEDDING_DIMENSIONS:-}
      RAG_MAX_NEW_TOKENS: ${RAG_MAX_NEW_TOKENS:-4096}
      RAG_MAX_NEW_TOKENS_HARD_LIMIT: ${RAG_MAX_NEW_TOKENS_HARD_LIMIT:-6000}
      RAG_DEMO_MODE: ${RAG_DEMO_MODE:-true}
      RAG_WHATSAPP_ENABLED: ${RAG_WHATSAPP_ENABLED:-true}
      RAG_WHATSAPP_VERIFY_TOKEN: ${RAG_WHATSAPP_VERIFY_TOKEN:-local-verify-token}
      RAG_WHATSAPP_WEBHOOK_SECRET: ${RAG_WHATSAPP_WEBHOOK_SECRET:-local-webhook-secret}
      RAG_WHATSAPP_ACCESS_TOKEN: ${RAG_WHATSAPP_ACCESS_TOKEN:-}
      RAG_WHATSAPP_PHONE_NUMBER_ID: ${RAG_WHATSAPP_PHONE_NUMBER_ID:-}
      RAG_WHATSAPP_GRAPH_API_VERSION: ${RAG_WHATSAPP_GRAPH_API_VERSION:-v22.0}
      RAG_WHATSAPP_WORKER_CONCURRENCY: ${RAG_WHATSAPP_WORKER_CONCURRENCY:-4}
      RAG_WHATSAPP_WORKER_POLL_SECONDS: ${RAG_WHATSAPP_WORKER_POLL_SECONDS:-1.0}
      RAG_WHATSAPP_HISTORY_TURNS: ${RAG_WHATSAPP_HISTORY_TURNS:-6}
      RAG_WHATSAPP_MAX_REPLY_CHARS: ${RAG_WHATSAPP_MAX_REPLY_CHARS:-4000}
      RAG_WHATSAPP_QUEUE_BACKEND: ${RAG_WHATSAPP_QUEUE_BACKEND:-redis}
      RAG_WHATSAPP_PROCESSED_STORE_BACKEND: ${RAG_WHATSAPP_PROCESSED_STORE_BACKEND:-redis}
      RAG_WHATSAPP_CONVERSATION_STORE_BACKEND: ${RAG_WHATSAPP_CONVERSATION_STORE_BACKEND:-redis}
      RAG_WHATSAPP_REDIS_URL: ${RAG_WHATSAPP_REDIS_URL:-redis://redis:6379/0}
      RAG_WHATSAPP_REDIS_KEY_PREFIX: ${RAG_WHATSAPP_REDIS_KEY_PREFIX:-kankor:whatsapp}
      RAG_WHATSAPP_PROCESSED_TTL_SECONDS: ${RAG_WHATSAPP_PROCESSED_TTL_SECONDS:-172800}
      RAG_WHATSAPP_CONVERSATION_TTL_SECONDS: ${RAG_WHATSAPP_CONVERSATION_TTL_SECONDS:-604800}
      RAG_WHATSAPP_OUTBOUND_BACKEND: ${RAG_WHATSAPP_OUTBOUND_BACKEND:-log}
      RAG_WHATSAPP_MEDIA_BACKEND: ${RAG_WHATSAPP_MEDIA_BACKEND:-noop}
      RAG_WHATSAPP_OCR_BACKEND: ${RAG_WHATSAPP_OCR_BACKEND:-noop}
      RAG_PDF_WINDOW_ADAPTIVE_ENABLED: ${RAG_PDF_WINDOW_ADAPTIVE_ENABLED:-false}
      RAG_PDF_WINDOW_ADAPTIVE_MIN_ATTACHMENTS: ${RAG_PDF_WINDOW_ADAPTIVE_MIN_ATTACHMENTS:-1}
      RAG_PDF_WINDOW_ADAPTIVE_TOP_SCORE_LOW: ${RAG_PDF_WINDOW_ADAPTIVE_TOP_SCORE_LOW:-0.42}
      RAG_PDF_WINDOW_ADAPTIVE_TOP_SCORE_VERY_LOW: ${RAG_PDF_WINDOW_ADAPTIVE_TOP_SCORE_VERY_LOW:-0.30}
      RAG_PDF_WINDOW_ADAPTIVE_SCORE_GAP_LOW: ${RAG_PDF_WINDOW_ADAPTIVE_SCORE_GAP_LOW:-0.003}
      RAG_PDF_WINDOW_ADAPTIVE_COMPLEXITY_LENGTH_TOKENS: ${RAG_PDF_WINDOW_ADAPTIVE_COMPLEXITY_LENGTH_TOKENS:-25}
      RAG_USE_V6_RETRIEVAL: "false"
      RAG_V6_PAGE_LOCALIZATION_MIN_CONFIDENCE: ${RAG_V6_PAGE_LOCALIZATION_MIN_CONFIDENCE:-0.4}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_BACKEND: ${RAG_RERANKER_BACKEND:-onnx_cross_encoder}
      RAG_RERANKER_MODEL_ID: ${RAG_RERANKER_MODEL_ID:-onnx-community/gte-multilingual-reranker-base}
      RAG_RERANKER_MODEL_REVISION: ${RAG_RERANKER_MODEL_REVISION:-5807a06097ed1e68331fec2201751ccaf356d96b}
      RAG_RERANKER_CANDIDATE_POOL_SIZE: ${RAG_RERANKER_CANDIDATE_POOL_SIZE:-8}
      RAG_RERANKER_MAX_LENGTH: ${RAG_RERANKER_MAX_LENGTH:-256}
      RAG_RERANKER_BATCH_SIZE: ${RAG_RERANKER_BATCH_SIZE:-8}
      RAG_RERANKER_TIMEOUT_MS: ${RAG_RERANKER_TIMEOUT_MS:-1500}
      RAG_TOC_ROUTING_MODE: ${RAG_TOC_ROUTING_MODE:-safe_topic_aware}
      RAG_TOC_TRACE_SAMPLE_RATE: ${RAG_TOC_TRACE_SAMPLE_RATE:-1.0}
      RAG_TIMING_DEBUG: ${RAG_TIMING_DEBUG:-false}

    volumes:
      - ../data:/app/data:ro
      - ../apps/api:/app/apps/api:ro
      - ../packages:/app/packages:ro
      - huggingface-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - '127.0.0.1:8100:8000'

  redis:
    image: redis:7-alpine
    profiles: ["whatsapp-local"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      - api
    environment:
      WEBUI_NAME: ${OPENWEBUI_WEBUI_NAME:-KARDAN GPT}
      OPENAI_API_BASE_URL: http://api:8000/v1
      OPENAI_API_BASE_URLS: http://api:8000/v1
      OPENAI_API_KEY: ${RAG_OPENAI_COMPAT_API_KEY:-changeme}
      OPENAI_API_KEYS: ${RAG_OPENAI_COMPAT_API_KEY:-changeme}
    ports:
      - '3000:8080'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - openwebui-data:/app/backend/data
      - ../openwebui/functions:/app/backend/data/functions:ro

volumes:
  openwebui-data:
  redis-data:
  huggingface-cache:
