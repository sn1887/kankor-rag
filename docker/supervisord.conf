[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:api]
directory=/app
command=python3 -m uvicorn kankor_api.main:app --host %(ENV_BACKEND_HOST)s --port %(ENV_BACKEND_PORT)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
priority=10

[program:web]
directory=/app/apps/web
command=npm run start -- --hostname %(ENV_HOST)s --port %(ENV_PORT)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
priority=20
