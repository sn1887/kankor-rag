[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kankor-api"
version = "0.1.0"
description = "Thin FastAPI service for the Kankor RAG Space."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.28.1",
  "orjson>=3.10.15",
  "rag-core"
]

[tool.hatch.build.targets.wheel]
packages = ["src/kankor_api"]
